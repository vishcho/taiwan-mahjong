<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eeeee9">
  <title>台灣麻將 · 三款直版手機提案</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="gallery-head">
    <div><p class="eyebrow">TAIWAN MAHJONG / MOBILE STUDY 01</p><h1>一手牌，三種打開方式。</h1><p class="intro">先看得懂，再打得順。為直版手機設計的牌效率工具。</p></div>
    <div class="gallery-note"><span class="live-dot"></span>視覺提案 · 固定示例<p>可試切換摸牌狀態、牌種與結果抽屜。<br>此預覽尚未串接分析引擎。</p></div>
  </header>
  <nav class="view-switch" aria-label="切換視覺提案">
    <button data-view="all" aria-pressed="true">三版比較</button>
    <button data-view="a" aria-pressed="false">A 清爽工具</button>
    <button data-view="b" aria-pressed="false">B 經典牌桌</button>
    <button data-view="c" aria-pressed="false">C 深色數據</button>
  </nav>
  <main class="gallery" id="gallery"></main>
  <footer class="gallery-footer"><span>共同原則：結果優先・大拇指輸入・單欄直向・色彩搭配文字標示</span><span>同一示例：打九萬，聽三索、六索，剩餘 7 張。</span></footer>
  <script src="app.js"></script>
</body>
</html>
